
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RUSH 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07101d;color:white;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}
.stat{background:#07101ddc;border:1px solid #00eaff;border-radius:12px;padding:10px;font-weight:bold;font-size:13px}
#title{position:fixed;top:65px;width:100%;text-align:center;font-size:24px;font-weight:900;letter-spacing:4px;color:#00f5ff;text-shadow:0 0 15px #00eaff;pointer-events:none}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020713a8}
.panel{text-align:center;background:#0b1734ed;border:1px solid #00eaff;border-radius:22px;padding:26px 20px;width:min(88%,340px);box-shadow:0 0 30px #00d9ff44}
.panel h1{color:#00f5ff;margin:0 0 12px;font-size:31px}
.panel p{line-height:1.6;color:#dbeafe;font-size:14px}
button{border:0;border-radius:13px;padding:14px 18px;font-weight:bold;font-size:16px;background:linear-gradient(120deg,#00eaff,#7c4dff);color:#06101d;touch-action:manipulation}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
#controls button{pointer-events:auto;width:75px;height:62px;font-size:25px;background:#07101ddd;border:1px solid #00eaff;color:white}
#boost{font-size:13px!important;color:#ffe66d!important;width:90px!important}
#hint{position:fixed;bottom:95px;width:100%;text-align:center;color:#d5e8ff;font-size:12px;text-shadow:0 2px 5px #000;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="stat">🏆 <span id="score">0</span></div>
 <div class="stat">🪙 <span id="coins">0</span></div>
 <div class="stat">BEST <span id="best">0</span></div>
</div>
<div id="title">NEON RUSH 3D</div>
<div id="hint">Avoid traffic • Collect coins • Arrow keys to steer</div>
<div id="controls">
 <button id="left">◀</button>
 <button id="boost">⚡ BOOST</button>
 <button id="right">▶</button>
</div>
<div id="overlay">
 <div class="panel">
  <h1 id="heading">NEON RUSH 3D</h1>
  <p id="message">Enter the 3D racing world!<br> Dodge traffic and collect golden coins.</p>
  <button id="start">▶ START RACE</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const host=document.getElementById('game');
if(!window.THREE){
 document.getElementById('heading').textContent='INTERNET REQUIRED';
 document.getElementById('message').textContent='Please connect to the internet and refresh this page.';
 return;
}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83cfff);
scene.fog=new THREE.Fog(0x83cfff,45,180);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
camera.position.set(0,6,11);
camera.lookAt(0,0,-12);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x45566b,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-8,15,7);sun.castShadow=true;
scene.add(sun);

function mat(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const grass=mat(0x328c4c),roadMat=mat(0x303746),lineMat=mat(0xe6f4ff);
const dark=mat(0x111522),glass=mat(0x8feaff,.25,.2);
const gold=mat(0xffc928,.25,.5);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,240),roadMat);
road.rotation.x=-Math.PI/2;road.position.set(0,-.08,-65);
road.receiveShadow=true;scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,260),grass);
ground.rotation.x=-Math.PI/2;ground.position.set(0,-.16,-65);
ground.receiveShadow=true;scene.add(ground);

for(const x of [-6.05,6.05]){
 const edge=new THREE.Mesh(new THREE.BoxGeometry(.12,.04,240),mat(0x00eaff));
 edge.position.set(x,-.01,-65);scene.add(edge);
}
const laneMarks=[];
for(const x of [-2,2]){
 for(let z=-175;z<20;z+=10){
  const m=new THREE.Mesh(new THREE.BoxGeometry(.10,.025,4),lineMat);
  m.position.set(x,-.015,z);scene.add(m);laneMarks.push(m);
 }
}

function makeCar(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.35,.48,2.5),mat(color,.3,.25));
 body.position.y=.55;body.castShadow=true;g.add(body);
 const hood=new THREE.Mesh(new THREE.BoxGeometry(1.15,.18,.7),mat(color,.3,.2));
 hood.position.set(0,.84,-.72);g.add(hood);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(.98,.48,1.15),glass);
 cabin.position.set(0,.98,.15);cabin.castShadow=true;g.add(cabin);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(.82,.08,.78),mat(color,.3,.2));
 roof.position.set(0,1.23,.17);g.add(roof);
 for(const x of [-.49,.49]){
  for(const z of [-.8,.8]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.16,16),dark);
   wheel.rotation.z=Math.PI/2;wheel.position.set(x,.3,z);wheel.castShadow=true;g.add(wheel);
  }
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(.25,.12,.06),mat(0xffffff,.2));
  lamp.position.set(x,.65,-1.27);g.add(lamp);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(.25,.12,.06),mat(0xff183f));
  tail.position.set(x,.65,1.27);g.add(tail);
 }
 return g;
}
const player=makeCar(0x00dfff);
player.position.set(0,0,4);scene.add(player);

const traffic=[],collectibles=[],decor=[];
const lanes=[-4,0,4];
function addTraffic(){
 const lane=lanes[Math.floor(Math.random()*3)];
 const car=makeCar([0xff3157,0xffad32,0x9b65ff,0x58e58a][Math.floor(Math.random()*4)]);
 car.position.set(lane,0,-95-Math.random()*20);
 scene.add(car);traffic.push(car);
}
function addCoin(){
 const c=new THREE.Mesh(new THREE.TorusGeometry(.48,.13,10,22),gold);
 c.position.set(lanes[Math.floor(Math.random()*3)],1,-90);
 c.rotation.x=Math.PI/2;scene.add(c);collectibles.push(c);
}
function tree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,1.5,7),mat(0x70421f));
 trunk.position.y=.75;g.add(trunk);
 const leaves=new THREE.Mesh(new THREE.ConeGeometry(1,2.7,7),mat(0x176b3b));
 leaves.position.y=2.4;g.add(leaves);
 g.position.set(x,0,z);scene.add(g);decor.push(g);
}
for(let z=-180;z<25;z+=13){
 tree(-10-Math.random()*3,z);
 tree(10+Math.random()*3,z-5);
}
let score=0,coinCount=0,best=0,frame=0,speed=0,playing=false,boostTime=0;
try{best=Number(localStorage.getItem('neon3DBest'))||0}catch(e){}
document.getElementById('best').textContent=best;
let targetLane=1;
function move(d){if(playing)targetLane=Math.max(0,Math.min(2,targetLane+d))}
document.getElementById('left').onclick=()=>move(-1);
document.getElementById('right').onclick=()=>move(1);
document.getElementById('boost').onclick=()=>{if(playing)boostTime=100};
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')move(-1);
 if(e.key==='ArrowRight'||e.key==='d')move(1);
 if(e.key===' '&&playing)boostTime=100;
 if(e.key==='Enter'&&!playing)document.getElementById('start').click();
});
function reset(){
 traffic.forEach(o=>scene.remove(o));traffic.length=0;
 collectibles.forEach(o=>scene.remove(o));collectibles.length=0;
 score=0;coinCount=0;frame=0;speed=.65;boostTime=0;
 targetLane=1;player.position.set(0,0,4);playing=true;
 document.getElementById('score').textContent='0';
 document.getElementById('coins').textContent='0';
 document.getElementById('overlay').style.display='none';
}
function gameOver(){
 playing=false;
 document.getElementById('heading').textContent='RACE OVER!';
 document.getElementById('message').innerHTML=
 'Score: '+Math.floor(score)+'<br>Coins: '+coinCount+'<br>Best: '+best;
 document.getElementById('start').textContent='↻ RACE AGAIN';
 document.getElementById('overlay').style.display='flex';
}
document.getElementById('start').onclick=reset;

function animate(){
 requestAnimationFrame(animate);
 if(playing){
  frame++;
  speed=Math.min(1.5,.65+score/5000)+(boostTime>0?.45:0);
  if(boostTime>0)boostTime--;
  score+=speed*.12;
  player.position.x+=(lanes[targetLane]-player.position.x)*.13;
  player.rotation.z=-(lanes[targetLane]-player.position.x)*.035;
  laneMarks.forEach(m=>{m.position.z+=speed*1.7;if(m.position.z>12)m.position.z=-180});
  decor.forEach(t=>{t.position.z+=speed;if(t.position.z>15)t.position.z=-190});
  if(frame%80===0)addTraffic();
  if(frame%95===0)addCoin();
  for(let i=traffic.length-1;i>=0;i--){
   const c=traffic[i];c.position.z+=speed*1.6;
   if(c.position.z>12){scene.remove(c);traffic.splice(i,1);continue}
   if(Math.abs(c.position.z-player.position.z)<2.1&&Math.abs(c.position.x-player.position.x)<1.25){
    gameOver();break;
   }
  }
  for(let i=collectibles.length-1;i>=0;i--){
   const c=collectibles[i];c.position.z+=speed*1.6;c.rotation.z+=.06;
   if(Math.abs(c.position.z-player.position.z)<1.5&&Math.abs(c.position.x-player.position.x)<1.3){
    coinCount++;score+=25;scene.remove(c);collectibles.splice(i,1);
    document.getElementById('coins').textContent=coinCount;
   }else if(c.position.z>12){scene.remove(c);collectibles.splice(i,1)}
  }
  document.getElementById('score').textContent=Math.floor(score);
  if(Math.floor(score)>best){
   best=Math.floor(score);document.getElementById('best').textContent=best;
   try{localStorage.setItem('neon3DBest',best)}catch(e){}
  }
 }
 camera.position.x+=(player.position.x*.3-camera.position.x)*.04;
 camera.lookAt(player.position.x*.2,.2,-12);
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
animate();
})();
</script>
</body>
</html>
