<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NEON RUSH 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
button,select,input{font:inherit}
button{padding:12px;border:1px solid #35e7ff;border-radius:12px;background:#101b2c;color:white;font-weight:bold}
#game{position:fixed;inset:0}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2}
.stat{background:#07101ddd;padding:10px;border:1px solid #35e7ff;border-radius:10px}
#title{position:fixed;top:65px;width:100%;text-align:center;letter-spacing:4px;font-weight:bold;font-size:24px;text-shadow:0 0 15px cyan}
#actions{position:fixed;top:10px;right:10px;display:flex;gap:5px;transform:translateY(52px);z-index:3}
#controls{position:fixed;bottom:12px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:end;gap:5px;z-index:3}
.group{display:flex;gap:5px}
.control{width:53px;height:57px;padding:3px;font-size:17px;touch-action:none}
.pedal{width:58px;height:62px;font-size:11px;touch-action:none}
#gas{border-color:#58ff99;color:#58ff99}
#brake{border-color:#ff6878;color:#ff6878}
#nitro{color:#ffe58b}
#speed{position:fixed;right:10px;bottom:90px;background:#07101ddd;border:1px solid cyan;border-radius:10px;padding:10px;z-index:2;text-align:center}
#speed b{font-size:25px;color:#35e7ff}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#020713aa;padding:15px}
.panel{width:min(390px,100%);max-height:90vh;overflow:auto;background:#07101bf2;border:1px solid #35e7ff;border-radius:20px;padding:22px;box-shadow:0 0 30px #00cfff33}
h1{font-size:32px;letter-spacing:3px}
h1 span{color:#35e7ff}
p{color:#b9cce0;line-height:1.5}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid button:first-child{grid-column:1/-1;background:#35dfff;color:#04101c}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0}
input[type=color]{width:55px;height:35px}
input[type=range]{width:125px}
select{max-width:150px;background:#142238;color:white;padding:8px;border-radius:7px}
label{font-size:14px}
@media(max-width:370px){.control{width:43px;height:49px}.pedal{width:48px;height:55px;font-size:10px}#title{font-size:19px}}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
 <div class="stat">🏆 <span id="score">0</span></div>
 <div class="stat">🪙 <span id="coins">0</span></div>
 <div class="stat">BEST <span id="best">0</span></div>
</div>

<div id="title">NEON RUSH <span style="color:#35e7ff">3D</span></div>

<div id="actions">
 <button id="pause">Ⅱ PAUSE</button>
 <button id="settingsBtn">⚙</button>
</div>

<div id="speed"><b id="speedNum">0</b><br><small>KM/H</small></div>

<div id="controls">
 <div class="group">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <button class="control" id="nitro">⚡<br>NITRO</button>
 <div class="group">
  <button class="pedal" id="brake">▣<br>BRAKE</button>
  <button class="pedal" id="gas">▲<br>GAS</button>
 </div>
</div>

<div id="overlay">
 <section class="panel" id="menu">
  <h1>NEON RUSH <span>3D</span></h1>
  <p>Customize your sports car and race on the highway!</p>
  <div class="grid">
   <button id="start">▶ START RACE</button>
   <button id="garage">🚘 GARAGE</button>
   <button id="openSettings">⚙ SETTINGS</button>
  </div>
  <p>Hold GAS to accelerate, BRAKE to slow down and use steering to avoid traffic.</p>
 </section>

 <section class="panel hidden" id="settings">
  <h2>⚙ Settings & Garage</h2>
  <div class="row"><label>Car Color</label><input id="carColor" type="color" value="#11cfff"></div>
  <div class="row"><label>Road Color</label><input id="roadColor" type="color" value="#343b49"></div>
  <div class="row"><label>Sky Color</label><input id="skyColor" type="color" value="#83cfff"></div>
  <div class="row"><label>Graphics</label>
   <select id="quality">
    <option value="low">Low</option>
    <option value="medium" selected>Medium</option>
    <option value="high">High</option>
   </select>
  </div>
  <div class="row"><label>Volume</label><input id="volume" type="range" min="0" max="100" value="50"></div>
  <div class="row"><label>Sound Effects</label><input id="sound" type="checkbox" checked></div>
  <div class="row"><label>Music</label><input id="music" type="checkbox" checked></div>
  <div class="row"><label>Shadows</label><input id="shadows" type="checkbox" checked></div>
  <div class="grid">
   <button id="save">SAVE SETTINGS</button>
   <button id="back">BACK</button>
  </div>
 </section>

 <section class="panel hidden" id="pauseMenu">
  <h2>GAME PAUSED</h2>
  <div class="grid">
   <button id="resume">▶ RESUME</button>
   <button id="restart">↻ RESTART</button>
   <button id="home">⌂ MAIN MENU</button>
  </div>
 </section>

 <section class="panel hidden" id="over">
  <h2>🏁 RACE OVER</h2>
  <p id="result"></p>
  <div class="grid">
   <button id="again">RACE AGAIN</button>
   <button id="home2">MAIN MENU</button>
  </div>
 </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const overlay=$("overlay");
const panels=[$("menu"),$("settings"),$("pauseMenu"),$("over")];

function show(panel){
 panels.forEach(p=>p.classList.add("hidden"));
 panel.classList.remove("hidden");
 overlay.classList.remove("hidden");
}
function hide(){overlay.classList.add("hidden")}

if(!window.THREE){
 $("menu").innerHTML="<h2>Internet required</h2><p>Connect to the internet and refresh to load the 3D engine.</p>";
 return;
}

let settings={
 carColor:"#11cfff",roadColor:"#343b49",skyColor:"#83cfff",
 quality:"medium",volume:50,sound:true,music:true,shadows:true
};

try{
 settings={...settings,...JSON.parse(localStorage.getItem("neonSettings")||"{}")};
}catch(e){}

function loadForm(){
 $("carColor").value=settings.carColor;
 $("roadColor").value=settings.roadColor;
 $("skyColor").value=settings.skyColor;
 $("quality").value=settings.quality;
 $("volume").value=settings.volume;
 $("sound").checked=settings.sound;
 $("music").checked=settings.music;
 $("shadows").checked=settings.shadows;
}
loadForm();

let best=Number(localStorage.getItem("neonBest"))||0;
$("best").textContent=best;

const scene=new THREE.Scene();
scene.background=new THREE.Color(settings.skyColor);
scene.fog=new THREE.Fog(settings.skyColor,45,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
camera.position.set(0,6,11);
camera.lookAt(0,0,-12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputEncoding=THREE.sRGBEncoding;
$("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x344050,1.7));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-8,15,8);
sun.castShadow=true;
scene.add(sun);

function mat(color,rough=.6,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}

const roadMat=mat(settings.roadColor,.9);
const groundMat=mat(0x376b42);
const white=mat(0xffffff);
const road=new THREE.Mesh(new THREE.PlaneGeometry(13,280),roadMat);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.1,-100);
scene.add(road);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(280,300),groundMat);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.2,-100);
scene.add(ground);

const marks=[];
for(let z=-260;z<30;z+=12){
 for(const x of [-2.15,2.15]){
  const m=new THREE.Mesh(new THREE.BoxGeometry(.1,.025,5),white);
  m.position.set(x,-.02,z);
  scene.add(m);
  marks.push(m);
 }
}

const scenery=[];
function tree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.18,1.5,8),mat(0x68452b)
 );
 trunk.position.y=.75;
 g.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(.9,9,8),
  mat([0x28613a,0x417c45,0x315d38][Math.floor(Math.random()*3)])
 );
 crown.position.y=1.9;
 crown.scale.set(1,1.2,1);
 g.add(crown);
 g.position.set(x,0,z);
 scene.add(g);
 scenery.push(g);
}
for(let z=-250;z<20;z+=18){
 tree(-10,z);
 tree(10,z-7);
}

function makeCar(color){
 const g=new THREE.Group();
 const paint=mat(color,.24,.55);
 const glass=mat(0x8bc7dc,.2,.3);
 const rubber=mat(0x101116,.8);
 const chrome=mat(0xbfcbd6,.25,.7);

 const body=new THREE.Mesh(new THREE.BoxGeometry(1.6,.42,2.9),paint);
 body.position.y=.62;
 g.add(body);

 const hood=new THREE.Mesh(new THREE.BoxGeometry(1.42,.16,.85),paint);
 hood.position.set(0,.84,-.92);
 g.add(hood);

 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.1,.48,1.25),glass);
 cabin.position.set(0,1.02,.12);
 g.add(cabin);

 const roof=new THREE.Mesh(new THREE.BoxGeometry(.92,.1,.7),paint);
 roof.position.set(0,1.3,.12);
 g.add(roof);

 const bumper=new THREE.Mesh(new THREE.BoxGeometry(1.5,.12,.12),chrome);
 bumper.position.set(0,.43,-1.48);
 g.add(bumper);

 for(const x of [-.55,.55]){
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(.3,.12,.06),mat(0xfff5d5));
  lamp.position.set(x,.72,-1.48);
  g.add(lamp);

  const tail=new THREE.Mesh(new THREE.BoxGeometry(.3,.12,.06),mat(0xff223d));
  tail.position.set(x,.72,1.48);
  g.add(tail);

  for(const z of [-.95,.95]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.29,.29,.2,16),rubber
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x*1.35,.33,z);
   g.add(wheel);

   const hub=new THREE.Mesh(
    new THREE.CylinderGeometry(.14,.14,.21,12),chrome
   );
   hub.rotation.z=Math.PI/2;
   hub.position.copy(wheel.position);
   g.add(hub);
  }
 }

 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return g;
}

const player=makeCar(settings.carColor);
player.position.set(0,0,4);
scene.add(player);

const lanes=[-4.2,0,4.2];
const traffic=[];
const coins=[];

function spawnTraffic(){
 const car=makeCar(["#ef334d","#f2a530","#6c64ff","#eeeeee","#44b878"][Math.floor(Math.random()*5)]);
 car.position.set(lanes[Math.floor(Math.random()*3)],0,-110-Math.random()*25);
 scene.add(car);
 traffic.push(car);
}

function spawnCoin(){
 const coin=new THREE.Mesh(
  new THREE.TorusGeometry(.42,.12,10,24),mat(0xffd34d,.25,.6)
 );
 coin.position.set(lanes[Math.floor(Math.random()*3)],1,-90);
 scene.add(coin);
 coins.push(coin);
}

let score=0,coinCount=0,frame=0,speed=.4;
let playing=false,paused=false,steer=0,gas=false,braking=false,nitro=0;
let audio=null;

function beep(freq=500,duration=.12){
 if(!settings.sound||!audio)return;
 try{
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.frequency.value=freq;
  gain.gain.value=(settings.volume/100)*.12;
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime+duration);
 }catch(e){}
}

function applySettings(){
 scene.background.set(settings.skyColor);
 scene.fog.color.set(settings.skyColor);
 roadMat.color.set(settings.roadColor);
 player.traverse(o=>{
  if(o.isMesh&&o.material&&o.material.metalness>.3&&o.material.roughness<.4){
   o.material.color.set(settings.carColor);
  }
 });
 renderer.shadowMap.enabled=settings.shadows&&settings.quality!=="low";
 renderer.setPixelRatio(Math.min(devicePixelRatio,
  settings.quality==="high"?2:settings.quality==="medium"?1.5:1));
 renderer.setSize(innerWidth,innerHeight);
}

function saveSettings(){
 settings={
  carColor:$("carColor").value,
  roadColor:$("roadColor").value,
  skyColor:$("skyColor").value,
  quality:$("quality").value,
  volume:Number($("volume").value),
  sound:$("sound").checked,
  music:$("music").checked,
  shadows:$("shadows").checked
 };
 try{localStorage.setItem("neonSettings",JSON.stringify(settings))}catch(e){}
 applySettings();
 beep(700);
 alert("Settings saved!");
}

function start(){
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  audio.resume();
 }catch(e){}
 traffic.forEach(c=>scene.remove(c));
 coins.forEach(c=>scene.remove(c));
 traffic.length=0;
 coins.length=0;
 score=0;coinCount=0;frame=0;speed=.4;nitro=0;
 player.position.set(0,0,4);
 player.rotation.set(0,0,0);
 steer=0;gas=false;braking=false;
 playing=true;paused=false;
 hide();
 $("pause").textContent="Ⅱ PAUSE";
}

function endRace(){
 playing=false;paused=false;
 beep(120,.35);
 best=Math.max(best,Math.floor(score));
 try{localStorage.setItem("neonBest",best)}catch(e){}
 $("best").textContent=best;
 $("result").innerHTML="Score: <b>"+Math.floor(score)+"</b><br>Coins: <b>"+coinCount+"</b><br>Best: <b>"+best+"</b>";
 show($("over"));
}

function pauseGame(){
 if(!playing)return;
 paused=!paused;
 if(paused){
  show($("pauseMenu"));
  $("pause").textContent="▶ RESUME";
 }else{
  hide();
  $("pause").textContent="Ⅱ PAUSE";
 }
}

function hold(id,down,up){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  down();
  try{el.setPointerCapture(e.pointerId)}catch(err){}
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(event=>{
  el.addEventListener(event,up);
 });
}

hold("left",()=>steer=-1,()=>steer=0);
hold("right",()=>steer=1,()=>steer=0);
hold("gas",()=>gas=true,()=>gas=false);
hold("brake",()=>braking=true,()=>braking=false);
hold("nitro",()=>{if(playing&&!paused)nitro=100},()=>{});

$("start").onclick=start;
$("again").onclick=start;
$("restart").onclick=start;
$("pause").onclick=pauseGame;
$("resume").onclick=()=>{paused=false;hide();$("pause").textContent="Ⅱ PAUSE"};
$("settingsBtn").onclick=()=>{loadForm();show($("settings"))};
$("openSettings").onclick=()=>{loadForm();show($("settings"))};
$("garage").onclick=()=>{loadForm();show($("settings"))};
$("back").onclick=()=>show($("menu"));
$("save").onclick=()=>{saveSettings();show($("menu"))};
$("home").onclick=()=>{playing=false;show($("menu"))};
$("home2").onclick=()=>show($("menu"));

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")steer=-1;
 if(e.key==="ArrowRight"||e.key==="d")steer=1;
 if(e.key==="ArrowUp"||e.key==="w")gas=true;
 if(e.key==="ArrowDown"||e.key==="s")braking=true;
 if(e.code==="Space")nitro=100;
 if(e.key==="Escape")pauseGame();
});
document.addEventListener("keyup",e=>{
 if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))steer=0;
 if(["ArrowUp","w"].includes(e.key))gas=false;
 if(["ArrowDown","s"].includes(e.key))braking=false;
});
window.addEventListener("blur",()=>{steer=0;gas=false;braking=false});

function animate(){
 requestAnimationFrame(animate);

 if(playing&&!paused){
  frame++;

  if(gas)speed=Math.min(2.4,speed+.018);
  else speed=Math.max(.25,speed-.002);

  if(braking)speed=Math.max(.08,speed-.04);
  if(nitro>0){speed=Math.min(2.8,speed+.025);nitro--;}

  player.position.x+=steer*(.07+speed*.04);
  player.position.x=Math.max(-5,Math.min(5,player.position.x));
  player.rotation.z+=(-steer*.12-player.rotation.z)*.15;

  score+=speed*.12;

  marks.forEach(m=>{
   m.position.z+=speed*2;
   if(m.position.z>15)m.position.z=-260;
  });

  scenery.forEach(t=>{
   t.position.z+=speed*1.4;
   if(t.position.z>22)t.position.z=-250-Math.random()*20;
  });

  if(frame%Math.max(35,Math.floor(95-speed*20))===0)spawnTraffic();
  if(frame%100===0)spawnCoin();

  for(let i=traffic.length-1;i>=0;i--){
   const c=traffic[i];
   c.position.z+=speed*1.9;
   if(c.position.z>14){
    scene.remove(c);traffic.splice(i,1);continue;
   }
   if(Math.abs(c.position.z-player.position.z)<2.3&&
      Math.abs(c.position.x-player.position.x)<1.4){
    endRace();break;
   }
  }

  for(let i=coins.length-1;i>=0;i--){
   const c=coins[i];
   c.position.z+=speed*1.9;
   c.rotation.y+=.05;
   if(Math.abs(c.position.z-player.position.z)<1.7&&
      Math.abs(c.position.x-player.position.x)<1.3){
    coinCount++;score+=25;beep(950);
    scene.remove(c);coins.splice(i,1);
   }else if(c.position.z>15){
    scene.remove(c);coins.splice(i,1);
   }
  }

  $("score").textContent=Math.floor(score);
  $("coins").textContent=coinCount;
  $("speedNum").textContent=Math.round(speed*72);

  if(Math.floor(score)>best){
   best=Math.floor(score);
   $("best").textContent=best;
   try{localStorage.setItem("neonBest",best)}catch(e){}
  }
 }

 camera.position.x+=(player.position.x*.18-camera.position.x)*.05;
 camera.lookAt(player.position.x*.12,.3,-12);
 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

applySettings();
animate();
})();
</script>
</body>
</html>
