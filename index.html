
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Highway Racer 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
button{background:#a6ef35;color:#152000;border:0;border-radius:7px;padding:12px;font-weight:bold;cursor:pointer}
#game{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.box{background:#101a18d9;padding:9px;border-radius:7px;font-size:13px}
#controls{position:fixed;bottom:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
.ctrl{background:#202d24dd;color:white;border:2px solid #a6ef35;width:58px;height:58px;font-size:19px;touch-action:none}
.pedal{width:65px;height:66px;font-size:12px;touch-action:none}
#brake{background:#9d2525;color:white;border-color:#ff7474}
#gas{background:#6caa13}
#menu{position:fixed;inset:0;background:#07100acc;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:min(390px,100%);background:#14221bed;border:1px solid #a6ef35;border-radius:16px;padding:22px;text-align:center}
h1{font-size:34px;margin:5px;color:#a6ef35}
p{color:#d2d9d2;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.actions button:first-child{grid-column:1/-1}
.small{background:#2b3a30;color:white;border:1px solid #7d9b70}
.hidden{display:none!important}
.caroption{font-size:14px}
#message{position:fixed;top:22%;width:100%;text-align:center;font-size:26px;color:#a6ef35;font-weight:bold;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
 <div class="box">SCORE<br><b id="score">0</b></div>
 <div class="box">🪙 <b id="coins">0</b></div>
 <div class="box">SPEED<br><b id="speed">0</b> km/h</div>
 <button id="pause">Ⅱ</button>
</div>

<div id="message"></div>

<div id="controls" class="hidden">
 <div>
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div>
  <button class="pedal" id="brake">BRAKE</button>
  <button class="pedal" id="gas">GAS ▲</button>
 </div>
</div>

<div id="menu">
 <div class="panel" id="mainPanel">
  <h1>HIGHWAY RACER</h1>
  <p>3D Traffic Racing</p>
  <p>Drive fast, dodge traffic and collect coins!</p>
  <div class="actions">
   <button id="play">▶ START RACE</button>
   <button class="small" id="garage">🚘 GARAGE</button>
   <button class="small" id="settingsBtn">⚙ SETTINGS</button>
  </div>
 </div>

 <div class="panel hidden" id="garagePanel">
  <h1>GARAGE</h1>
  <p>Select your car</p>
  <div class="actions">
   <button class="caroption" data-color="#167dff">🔵 BLUE SPORTS</button>
   <button class="caroption" data-color="#e52b32">🔴 RED SPORTS</button>
   <button class="caroption" data-color="#eeeeee">⚪ WHITE SPORTS</button>
   <button class="caroption" data-color="#ffb21b">🟠 ORANGE SPORTS</button>
   <button class="small" id="back">BACK</button>
  </div>
 </div>

 <div class="panel hidden" id="settingsPanel">
  <h1>SETTINGS</h1>
  <p>Graphics quality</p>
  <select id="quality">
   <option value="low">Low</option>
   <option value="medium" selected>Medium</option>
   <option value="high">High</option>
  </select>
  <p><label><input type="checkbox" id="shadows" checked> Shadows</label></p>
  <p>Road color <input type="color" id="roadColor" value="#454545"></p>
  <button id="saveSettings">SAVE</button>
  <button class="small" id="backSettings">BACK</button>
 </div>

 <div class="panel hidden" id="pausePanel">
  <h1>PAUSED</h1>
  <div class="actions">
   <button id="resume">▶ RESUME</button>
   <button id="restart">↻ RESTART</button>
   <button class="small" id="home">MAIN MENU</button>
  </div>
 </div>

 <div class="panel hidden" id="overPanel">
  <h1>RACE OVER</h1>
  <p id="result"></p>
  <div class="actions">
   <button id="again">RACE AGAIN</button>
   <button class="small" id="home2">MAIN MENU</button>
  </div>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){$("mainPanel").innerHTML="Internet connection required to load 3D graphics.";return;}

let scene,camera,renderer,player;
let traffic=[],trees=[],marks=[],coins=[];
let running=false,paused=false,gas=false,brake=false,steer=0;
let speed=0,score=0,coinCount=0,frame=0;
let carColor="#167dff",best=0;

try{best=+(localStorage.getItem("hrBest")||0)}catch(e){}

function panel(id){
 document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));
 $(id).classList.remove("hidden");
 $("menu").classList.remove("hidden");
}
function hideMenu(){$("menu").classList.add("hidden")}
function material(c,rough=.7,metal=0){
 return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});
}

let roadMat,groundMat;
const carMaterials=[];

function makeCar(color){
 const g=new THREE.Group();
 const paint=material(color,.28,.35);
 carMaterials.push({mat:paint,group:g});
 const glass=material(0x9fc8dc,.22,.2);
 const tire=material(0x151515);
 const silver=material(0xbac1c9,.25,.7);

 function part(w,h,d,x,y,z,m){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z);o.castShadow=true;g.add(o);return o;
 }
 part(1.7,.42,3,0,.55,0,paint);
 part(1.35,.48,1.35,0,.94,.15,glass);
 part(1.05,.1,.8,0,1.23,.1,paint);
 part(1.45,.13,.15,0,.35,-1.45,silver);
 for(const x of [-.58,.58]){
  part(.32,.12,.06,x,.68,-1.51,material(0xfff4c2));
  part(.3,.12,.06,x,.68,1.51,material(0xff2424));
  for(const z of [-.92,.95]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.31,.31,.2,16),tire);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x*1.48,.3,z);g.add(wheel);
  }
 }
 return g;
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color("#b5d5df");
 scene.fog=new THREE.Fog("#b5d5df",55,180);

 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
 camera.position.set(0,10,15);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;
 $("game").appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x627050,2));
 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(-15,25,12);
 sun.castShadow=true;scene.add(sun);

 groundMat=material("#b4aa72");
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,400),groundMat);
 ground.rotation.x=-Math.PI/2;
 ground.position.set(0,-.18,-140);scene.add(ground);

 roadMat=material($("roadColor").value,.9);
 const road=new THREE.Mesh(new THREE.PlaneGeometry(12,400),roadMat);
 road.rotation.x=-Math.PI/2;
 road.position.set(0,-.08,-140);scene.add(road);

 for(let z=-380;z<30;z+=10){
  for(const x of [-2,2]){
   const m=new THREE.Mesh(new THREE.BoxGeometry(.09,.025,4),material("#eeeecc"));
   m.position.set(x,-.02,z);scene.add(m);marks.push(m);
  }
  for(const x of [-7,7]){
   const rail=new THREE.Mesh(new THREE.BoxGeometry(.15,.25,9),material("#77796f"));
   rail.position.set(x,.05,z);scene.add(rail);
  }
 }

 for(let z=-370;z<30;z+=15){
  tree(-10,z);tree(10,z-5);
 }

 player=makeCar(carColor);
 player.position.set(0,0,5);scene.add(player);
 applySettings();
}

function tree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.6,7),material("#785334"));
 trunk.position.y=.8;g.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(.8,8,7),material("#4e783b"));
 crown.position.y=1.8;crown.scale.set(1.2,1.1,1.2);g.add(crown);
 // Palm-like leaves
 for(let i=0;i<5;i++){
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(.18,.09,1.7),material("#527f39"));
  leaf.position.y=2.15;
  leaf.rotation.y=i*Math.PI/2.5;
  leaf.rotation.x=-.2;
  g.add(leaf);
 }
 g.position.set(x,0,z);scene.add(g);trees.push(g);
}

function applySettings(){
 if(!scene)return;
 roadMat.color.set($("roadColor").value);
 renderer.shadowMap.enabled=$("shadows").checked;
 const q=$("quality").value;
 renderer.setPixelRatio(Math.min(devicePixelRatio,q==="high"?2:q==="medium"?1.5:1));
 renderer.setSize(innerWidth,innerHeight);
}

function clearObjects(list){
 list.forEach(o=>scene.remove(o));list.length=0;
}

function reset(){
 clearObjects(traffic);clearObjects(coins);
 score=0;coinCount=0;frame=0;speed=0;
 player.position.set(0,0,5);player.rotation.set(0,0,0);
 gas=false;brake=false;steer=0;
 running=true;paused=false;
 $("hud").classList.remove("hidden");
 $("controls").classList.remove("hidden");
 $("message").textContent="";
 $("pause").textContent="Ⅱ";
 hideMenu();
}

function spawnTraffic(){
 const c=makeCar(["#e4e4e4","#d72d2d","#20252a","#e8ad28"][Math.floor(Math.random()*4)]);
 c.scale.setScalar(.9+Math.random()*.15);
 c.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-100-Math.random()*40);
 scene.add(c);traffic.push(c);
}

function spawnCoin(){
 const c=new THREE.Mesh(new THREE.TorusGeometry(.42,.12,8,18),material("#ffcb30",.25,.65));
 c.position.set([-4,0,4][Math.floor(Math.random()*3)],1,-95);
 scene.add(c);coins.push(c);
}

function finish(){
 running=false;paused=false;
 best=Math.max(best,Math.floor(score));
 try{localStorage.setItem("hrBest",best)}catch(e){}
 $("result").innerHTML="Score: "+Math.floor(score)+"<br>Coins: "+coinCount+"<br>Best: "+best;
 $("hud").classList.add("hidden");
 $("controls").classList.add("hidden");
 panel("overPanel");
}

function tick(){
 requestAnimationFrame(tick);
 if(running&&!paused){
  frame++;
  if(gas)speed=Math.min(1.8,speed+.012);
  else speed=Math.max(.25,speed-.002);
  if(brake)speed=Math.max(0,speed-.035);

  player.position.x+=steer*(.08+speed*.025);
  player.position.x=Math.max(-5,Math.min(5,player.position.x));
  player.rotation.z+=(steer*.1-player.rotation.z)*.15;
  score+=speed*.12;

  marks.forEach(m=>{m.position.z+=speed*2.5;if(m.position.z>15)m.position.z=-380});
  trees.forEach(t=>{t.position.z+=speed*1.4;if(t.position.z>20)t.position.z=-370-Math.random()*25});

  if(frame%75===0)spawnTraffic();
  if(frame%95===0)spawnCoin();

  for(let i=traffic.length-1;i>=0;i--){
   const c=traffic[i];c.position.z+=speed*2.1;
   if(c.position.z>15){scene.remove(c);traffic.splice(i,1);continue;}
   if(Math.abs(c.position.z-player.position.z)<2.1&&Math.abs(c.position.x-player.position.x)<1.45){
    finish();break;
   }
  }

  for(let i=coins.length-1;i>=0;i--){
   const c=coins[i];c.position.z+=speed*2.1;c.rotation.y+=.06;
   if(Math.abs(c.position.z-player.position.z)<1.8&&Math.abs(c.position.x-player.position.x)<1.4){
    coinCount++;score+=20;scene.remove(c);coins.splice(i,1);
   }else if(c.position.z>15){scene.remove(c);coins.splice(i,1);}
  }

  $("score").textContent=Math.floor(score);
  $("coins").textContent=coinCount;
  $("speed").textContent=Math.round(speed*120);
 }
 if(camera&&player){
  camera.position.x+=(player.position.x*.25-camera.position.x)*.05;
  camera.lookAt(player.position.x*.15,0,-12);
 }
 renderer.render(scene,camera);
}

$("play").onclick=reset;
$("again").onclick=reset;
$("restart").onclick=reset;
$("garage").onclick=()=>panel("garagePanel");
$("settingsBtn").onclick=()=>panel("settingsPanel");
$("back").onclick=()=>panel("mainPanel");
$("backSettings").onclick=()=>panel("mainPanel");
$("saveSettings").onclick=()=>{applySettings();panel("mainPanel")};
$("pause").onclick=()=>{
 if(!running)return;
 paused=!paused;
 if(paused)panel("pausePanel");
 else hideMenu();
};
$("resume").onclick=()=>{paused=false;hideMenu()};
$("home").onclick=()=>{running=false;$("hud").classList.add("hidden");$("controls").classList.add("hidden");panel("mainPanel")};
$("home2").onclick=$("home").onclick;

document.querySelectorAll(".caroption").forEach(b=>{
 b.onclick=()=>{
  carColor=b.dataset.color;
  if(player){
   scene.remove(player);
   player=makeCar(carColor);player.position.set(0,0,5);scene.add(player);
  }
  panel("mainPanel");
 };
});

function hold(id,down,up){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();down();});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,up));
}
hold("left",()=>steer=-1,()=>steer=0);
hold("right",()=>steer=1,()=>steer=0);
hold("gas",()=>gas=true,()=>gas=false);
hold("brake",()=>brake=true,()=>brake=false);

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")steer=-1;
 if(e.key==="ArrowRight"||e.key==="d")steer=1;
 if(e.key==="ArrowUp"||e.key==="w")gas=true;
 if(e.key==="ArrowDown"||e.key==="s")brake=true;
});
document.addEventListener("keyup",e=>{
 if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))steer=0;
 if(["ArrowUp","w"].includes(e.key))gas=false;
 if(["ArrowDown","s"].includes(e.key))brake=false;
});
window.addEventListener("blur",()=>{steer=0;gas=false;brake=false});
window.addEventListener("resize",()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

init();
tick();
})();
</script>
</body>
</html>
